        body:
          mimeType: multipart/form-data
          params:
            - id: pair_9e04fe618b3949bbbbda41ba483342b6
              name: content
              value: "Curtis  #James Jackson III (Queens, Nueva York, 6 de julio de 1975),[1]​
                más conocido por su nombre artístico 50 Cent, es un rapero y
                actor estadounidense. \\r Alcanzó la fama mundial con el
                lanzamiento de sus álbumes Get Rich or Die Tryin' (2003) y The
                Massacre (2005), ambos de ellos logrando éxito multiplatino. Get
                Rich or Die Tryin’ logró ser más de diez veces platino y The
                Massacre más de catorce veces platino en todo el mundo los
                cuales están entre los primeros cincuenta mejores álbumes de la
                década de 2000 según la revista Billboard.Tras dejar el tráfico
                de drogas para comenzar su carrera como rapero, fue víctima de
                un tiroteo en el que recibió el impacto de nueve balas durante
                un incidente en 2000. Después de lanzar su álbum Guess Who's
                Back? en 2002, Jackson fue redescubierto (dado que su primera
                aparición como MC fue en React del álbum Shut ‘em Down de Onyx
                en el 98) por el rapero Eminem y firmó con Interscope Records.
                Con la ayuda de Eminem y Dr. Dre, produjo su primer éxito
                comercial importante. Jackson se convirtió en uno de los raperos
                más destacados del mundo en cuanto a ventas. En 2003, fundó el
                sello discográfico G-Unit Records, que contrató a varios raperos
                de éxito mundial como Lloyd Banks y Tony Yayo.Jackson también se
                ha dado a conocer por disputas con otros cantantes de rap como
                Ja Rule, Nas, Fat Joe, Jadakiss, Cam'ron, Diddy, Rick Ross, y
                los exmiembros de G-Unit, The Game y Young Buck. También ha
                desarrollado una carrera como actor, apareciendo en la película
                semiautobiográfica Get Rich or Die Tryin' en 2005, Home of the
                Brave (película sobre la guerra de Irak) en 2006, y Righteous
                Kill en 2008, entre otras. 50 Cent se ubicó como el sexto mejor
                artista de la década de 2000 según la revista Billboard. La
                revista también lo ubicó como el cuarto artista masculino más
                popular y como el tercer mejor rapero de la década por detrás de
                Eminem y Nelly. La revista Billboard también lo ubicó como el
                sexto mejor y más exitoso artista del Hot 100 de la década de
                2000 y el artista de rap número uno de la década de 2000.
                Billboard clasificó su disco Get Rich or Die Tryin en el número
                12 como el mejor álbum de la década de 2000 y su álbum The
                Massacre en el número 37. El 20 de febrero de 2014, 50 Cent
                abandonó Interscope Records, Shady Records y Aftermath
                Entertainment después de una unión de doce años. Finalmente él y
                su sello G-Unit Records firmaron un acuerdo de distribución con
                Caroline #Records y un contrato de grabación con Capitol Records
                para ponerle fecha a su quinto álbum de estudio Animal Ambition;
                su lanzamiento se hizo efectivo el 3 de junio de 2014."
